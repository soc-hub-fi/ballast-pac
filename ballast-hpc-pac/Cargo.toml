[package]
authors = [
    "Henri Lunnikivi <henri.lunnikivi@tuni.fi>, Esko Pekkarinen <esko.pekkarinen@tuni.fi>, Aisha Ahmed <aisha.ahmed@tuni.fi>",
]
categories = ["embedded", "hardware-support", "no-std"]
description = "Peripheral access API for HPC subsystem of Ballast SoC"
edition = "2018"
keywords = ["ballast", "ibex", "register", "peripheral", "generated"]
name = "ballast-hpc-pac"
version = "0.2.1"

[dependencies]
bare-metal = { workspace = true }
vcell = { workspace = true }
critical-section  = { workspace = true, optional = true }
riscv = { workspace = true }
riscv-rt = { workspace = true, optional = true }
riscv-peripheral = { git = "https://github.com/romancardenas/riscv-peripheral.git" }
embedded-hal = "1.0.0-rc.1"
riscv-slic = { version = "0.1.1", features = ["clint-backend"] }

[features]
rt = ["riscv-rt"]
